name: digest

on:
  schedule:
    - cron: "30 0 * * *"    # daily, 06:00 IST
    - cron: "30 2 * * 0"    # weekly, Sunday 08:00 IST (after that morning's daily)
  workflow_dispatch:
    inputs:
      mode:
        description: daily or weekly
        default: daily
      no_send:
        description: build everything but don't email
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_TOKEN }}
          FOUNDRY_BASE_URL: ${{ secrets.FOUNDRY_BASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 2 * * 0" ]; then MODE=weekly; else MODE=daily; fi
          fi
          python run.py "$MODE" ${{ inputs.no_send && '--no-send' || '' }}

      - name: Commit state and archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
