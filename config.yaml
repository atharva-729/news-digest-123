# L1-L2-L3 News Digest config. Everything tunable lives here, nothing is hardcoded.

edition_size: 25          # total L1 items shown in a daily edition

# Share of L1 items shown per section (must sum to 1.0). Order = order in the newsletter.
section_mix:
  tech: 0.50
  politics_india: 0.15
  politics_world: 0.10
  markets: 0.10
  sports: 0.05
  fun: 0.10

# What each section covers; given to the selection prompt.
section_descriptions:
  tech: "AI, hardware/semiconductors, big-tech company moves, tech-related finance (earnings, tech stocks), startups and funding in India and worldwide, manufacturing"
  politics_india: "Indian politics and policy"
  politics_world: "international politics and geopolitics"
  markets: "oil and commodities, non-tech stocks, central banks (RBI, Fed, BoJ, ECB), macro policy"
  sports: "global sports highlights"
  fun: "trivia or something genuinely fun from the period"

model:
  # Any OpenAI-compatible chat-completions endpoint. Its base URL comes from FOUNDRY_BASE_URL (.env / secrets),
  # so it isn't published. Default reasoning "none" (gpt-5.4-mini rejects "minimal"); steps raise it as needed.
  project: l1l2l3          # appended to the token as "Bearer <token>:<project>"
  name: gpt-5.4-mini      # every step (user, 2026-10-30)
  fallbacks: [gpt-5-mini, gpt-4.1-mini]
  params: {reasoning_effort: none}   # GPT-5 models ignore temperature
  max_retries: 4          # per model, with exponential backoff
  # USD per million tokens, for the cost column in data/llm_usage.jsonl. List prices, checked 2026-10-28
  # from memory of OpenAI's pricing page; verify before relying on them. Unknown models log usd: null.
  prices:
    gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.50}   # input confirmed by user; output assumed
    gpt-5-mini:   {input: 0.25, cached_input: 0.025, output: 2.00}
    gpt-5-nano:   {input: 0.05, cached_input: 0.005, output: 0.40}
    gpt-4.1-mini: {input: 0.40, cached_input: 0.10,  output: 1.60}

# Predictions ("calls"): must be checkable and able to fail.
calls:
  cooldown_days: 7          # no second call on a thread within this many days
  min_confidence: 20
  max_confidence: 80

# Developing stories: one event with several articles that isn't evidence for any pattern.
developing:
  min_articles: 3
  lookback_days: 7

writing:
  # The one step where voice matters; everything else stays on the cheap default model.
  model: gpt-5.4-mini
  params: {reasoning_effort: low}   # the quiz answers and the call need a little thought

connect:
  params: {reasoning_effort: low}

# Reading the picks (digest/articles.py). Pages are read only where robots.txt allows us and AI assistants
# that fetch for a user; text stays in the git-ignored cache/ and only feeds the explanations.
read:
  enough_words: 250          # feed text this long is enough; otherwise try the article page
  max_words: 700             # per article, sent to the writer
  limited_below_words: 25    # under this (about a headline's worth), the card says "limited info"
  timeout_seconds: 15

# L3 in plain words. Fixed on purpose: the same sentence every day is easier to remember.
forces_explained:
  technology: "New tools and inventions that change what people and companies can do."
  capital: "Money looking for its next profit, and who gets it."
  geopolitics: "Countries competing for power, safety and resources."
  regulation: "Governments and courts setting or changing the rules."
  demographics: "Who people are (age, numbers, where they live, how they vote) and how that's shifting."   # finds today<->last-week links and thread backstory

# Shown in every newsletter footer.
credit: {name: "@neworderindia", url: "https://www.instagram.com/neworderindia/"}
site_url: https://atharva-729.github.io/news-digest-123/   # GitHub Pages; email teasers link here

ingest:
  daily_window_hours: 24
  weekly_window_days: 7
  dedupe_title_similarity: 85   # rapidfuzz token_set_ratio threshold
  max_items_per_feed: 8         # newest N per feed after the time filter (keeps a run at ~100-300 items)
  lookback_days: 7              # "last week" context for connections (data/context/DATE.json)
  lookback_items_per_feed_day: 4   # per feed per day, so the week is evenly covered
  lookback_max_items: 300       # titles only go to the model, so 300 is ~8k tokens
  timeout_seconds: 20

threads:
  forces: [technology, capital, geopolitics, regulation, demographics]   # fixed L3 list
  dormant_after_days: 10
  max_active_threads: 15
  min_events_for_new_thread: 2      # distinct events, not articles: ten reports of one election are one event
  max_new_evidence_per_day: 4       # per thread; keeps one busy day from turning a thread into a catch-all
  overlap_similarity: 48            # claim token_set_ratio that flags a look-alike pair (plus a shared force).
                                    # Calibrated 2026-10-29: real overlaps score ~48-51 because wording differs;
                                    # the model then decides merge vs distinct, so false alarms are cheap.
  split_min_events: 10              # a thread with this many events in 14 days is offered a split
  heating_ratio: 1.5                # events this week vs the thread's average week
  cooling_ratio: 0.5
  min_history_days: 14              # younger threads are "new" (< 7 days) or "building"
  verify_params: {reasoning_effort: low}   # minimal let 'firmware bug -> data-centre slowdown' through
  params: {reasoning_effort: medium}   # matching ~25 stories to ~20 candidates is the hardest judgement; low skipped merges

# Feeds per section. `gn:` entries are Google News RSS searches (query string only);
# they are expanded with hl/gl/ceid from google_news below. `when:1d` keeps them fresh.
google_news:
  hl: en-IN
  gl: IN
  ceid: "IN:en"

